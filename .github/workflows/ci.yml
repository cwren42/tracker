name: CI

on:
  push:
    branches: [ main, "security-*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # Security/wiring tests set their own dummy env in conftest and do not
        # touch a database, so no secrets are required in CI.
        run: pytest -ra
