# Nginx reverse proxy for Tracker RMM Gateway (WebSockets)
#
# Copy into e.g. /etc/nginx/sites-available/rmm-gateway
# and symlink into sites-enabled.
#
# REQUIRED: replace these placeholders:
# - server_name
# - ssl_certificate / ssl_certificate_key paths

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name rmm.corp.cirque.com;

    # TLS certs (Windows-issued). Nginx needs PEM.
    # If you have a PFX, convert it to PEM (see notes in rmm_gateway/README.md).
    ssl_certificate     /etc/nginx/certs/rmm.cirque.com.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/rmm.cirque.com.key;

    # Optional: increase if you stream large outputs
    client_max_body_size 10m;

    # IMPORTANT: query-string contains tokens in the current MVP protocol.
    # Disable access logs for this vhost (or customize log_format to omit args).
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

server {
    listen 80;
    server_name rmm.corp.cirque.com;
    return 301 https://$host$request_uri;
}
