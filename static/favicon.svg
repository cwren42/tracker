<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0d6efd" stroke="#fff" stroke-width="2"/>
  
  <!-- Laptop screen -->
  <rect x="25" y="30" width="50" height="35" rx="2" fill="#fff"/>
  
  <!-- Laptop base -->
  <path d="M 20 65 L 23 70 L 77 70 L 80 65 Z" fill="#fff"/>
  
  <!-- Screen content - checkmark -->
  <path d="M 38 47 L 44 54 L 62 38" stroke="#0d6efd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Trackpad indicator -->
  <rect x="45" y="67" width="10" height="2" rx="1" fill="#0d6efd"/>
</svg>
