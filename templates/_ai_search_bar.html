{#
  AI Search Bar — include on any page.
  Usage:  {% include '_ai_search_bar.html' %}
  Optionally set:  {% set ai_context = "tickets" %}  before including.
#}
<div class="ai-search-bar mb-4" id="aiSearchBar-{{ ai_context|default('general') }}">
  <div class="input-group shadow-sm">
    <span class="input-group-text border-0 px-3" style="background:#1e293b;color:#818cf8;" title="AI Search">
      <i class="bi bi-stars"></i>
    </span>
    <input type="text"
           class="form-control border-0 bg-dark text-white ai-search-input"
           placeholder="{% if ai_context == 'tickets' %}Ask AI… e.g. &quot;open tickets over 7 days&quot; or &quot;unassigned high priority&quot;{% elif ai_context == 'employees' %}Ask AI… e.g. &quot;employees without assets&quot; or &quot;who is in IT department&quot;{% elif ai_context == 'licenses' %}Ask AI… e.g. &quot;licenses expiring this month&quot; or &quot;over-allocated licenses&quot;{% elif ai_context == 'reports' %}Ask AI… e.g. &quot;asset cost by department&quot; or &quot;devices out of warranty&quot;{% elif ai_context == 'monitoring' %}Ask AI… e.g. &quot;assets with high CPU alerts&quot; or &quot;offline devices&quot;{% elif ai_context == 'compliance' %}Ask AI… e.g. &quot;controls with missing evidence&quot; or &quot;open risks by severity&quot;{% elif ai_context == 'assets' %}Ask AI… e.g. &quot;laptops out of warranty&quot; or &quot;unassigned devices&quot;{% elif ai_context == 'dashboard' %}Ask AI… e.g. &quot;what needs attention today&quot; or &quot;assets added this week&quot;{% else %}Ask AI anything about your assets, tickets, employees, or compliance…{% endif %}"
           autocomplete="off"
           data-ai-context="{{ ai_context|default('general') }}"
           style="background:#1e293b!important;color:#f1f5f9!important;">
    <button class="btn px-3 ai-search-btn" style="background:#4f46e5;color:#fff;border:none;" type="button">
      <i class="bi bi-send-fill me-1"></i><span class="d-none d-sm-inline">Ask</span>
    </button>
    <button class="btn btn-outline-secondary border-0 ai-clear-btn d-none px-2" type="button" title="Clear">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <div class="ai-search-result mt-2 d-none rounded p-3"
       style="background:#0f172a;border:1px solid rgba(99,102,241,.35);color:#f1f5f9;font-size:.88rem;"></div>
</div>



<script src="/static/js/_ai_search_bar.js"></script>
