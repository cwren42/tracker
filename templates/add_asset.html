{% extends "base.html" %}

{% block title %}Add Asset - Asset Tracker{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Add New Asset</h1>
            <a href="{{ url_for('assets') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="asset_tag" class="form-label">Asset Tag *</label>
                            <input type="text" class="form-control" id="asset_tag" name="asset_tag" required>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">Asset Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="">Select Category</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Desktop">Desktop</option>
                                <option value="Monitor">Monitor</option>
                                <option value="Keyboard">Keyboard</option>
                                <option value="Mouse">Mouse</option>
                                <option value="Server">Server</option>
                                <option value="Network Equipment">Network Equipment</option>
                                <option value="Printer">Printer</option>
                                <option value="Phone">Phone</option>
                                <option value="Tablet">Tablet</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label">Status *</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Available">Available</option>
                                <option value="In Use">In Use</option>
                                <option value="In Repair">In Repair</option>
                                <option value="Retired">Retired</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="manufacturer" class="form-label">Manufacturer</label>
                            <input type="text" class="form-control" id="manufacturer" name="manufacturer">
                        </div>
                        <div class="col-md-6">
                            <label for="model" class="form-label">Model</label>
                            <input type="text" class="form-control" id="model" name="model">
                        </div>
                        <div class="col-md-6">
                            <label for="serial_number" class="form-label">Serial Number</label>
                            <input type="text" class="form-control" id="serial_number" name="serial_number">
                        </div>
                        <div class="col-md-6">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location">
                        </div>
                        <div class="col-md-6">
                            <label for="rustdesk_id" class="form-label">RustDesk ID</label>
                            <input type="text" class="form-control" id="rustdesk_id" name="rustdesk_id" placeholder="e.g. 123 456 789">
                            <small class="text-muted">Used for remote support via RustDesk</small>
                        </div>
                        <div class="col-md-4">
                            <label for="purchase_date" class="form-label">Purchase Date</label>
                            <input type="date" class="form-control" id="purchase_date" name="purchase_date">
                        </div>
                        <div class="col-md-4">
                            <label for="purchase_cost" class="form-label">Purchase Cost ($)</label>
                            <input type="number" step="0.01" class="form-control" id="purchase_cost" name="purchase_cost">
                        </div>
                        <div class="col-md-4">
                            <label for="warranty_expiry" class="form-label">Warranty Expiry</label>
                            <input type="date" class="form-control" id="warranty_expiry" name="warranty_expiry">
                        </div>
                        <div class="col-md-6">
                            <label for="expected_life_years" class="form-label">Expected Life (years)</label>
                            <select class="form-select" id="expected_life_years" name="expected_life_years">
                                <option value="3" selected>3 years</option>
                                <option value="4">4 years</option>
                                <option value="5">5 years</option>
                                <option value="7">7 years</option>
                                <option value="10">10 years</option>
                            </select>
                            <small class="text-muted">Typical: Laptops/PCs 3-5 years, Monitors 5-7 years</small>
                        </div>
                        <div class="col-md-6">
                            <label for="condition" class="form-label">Condition</label>
                            <select class="form-select" id="condition" name="condition">
                                <option value="Excellent">Excellent</option>
                                <option value="Good" selected>Good</option>
                                <option value="Fair">Fair</option>
                                <option value="Poor">Poor</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label for="photo" class="form-label">Asset Photo</label>
                            <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                            <small class="text-muted">Accepted formats: JPG, PNG, GIF (Max 16MB)</small>
                        </div>
                        <div class="col-md-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Add Asset
                        </button>
                        <a href="{{ url_for('assets') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
