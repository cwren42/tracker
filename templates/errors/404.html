{% extends "base.html" %}
{% block title %}Page Not Found — Asset Tracker{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height:60vh;">
    <div style="font-size:4rem;margin-bottom:1rem;">🔍</div>
    <h1 class="mb-2">Page Not Found</h1>
    <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
    <div class="d-flex gap-3">
        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Dashboard</a>
        <button onclick="history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Go Back</button>
    </div>
</div>
{% endblock %}
