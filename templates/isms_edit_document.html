{% extends "base.html" %}

{% block title %}Edit {{ document.title }}{% endblock %}

{% block content %}
<div class="mb-3 d-flex gap-2 flex-wrap">
    <a href="{{ url_for('isms.document_detail', document_id=document.id) }}" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back to Document
    </a>
    <a href="{{ url_for('isms.document_history', document_id=document.id) }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-clock-history"></i> Version History
    </a>
</div>

<div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
    <div>
        <h1 class="mb-1">Edit {{ document.title }}</h1>
        <div class="text-muted small">Current base version: v{{ version.version_number }}</div>
    </div>
    <div class="badge bg-dark">{{ document.slug }}</div>
</div>

<form method="POST">
    <input type="hidden" name="base_version_id" value="{{ version.id }}">
    <div class="row g-3">
        <div class="col-xl-7">
            <div class="card h-100">
                <div class="card-header"><strong>Markdown</strong></div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="change_summary" class="form-label">Change Summary</label>
                        <input type="text" class="form-control" id="change_summary" name="change_summary" maxlength="500" placeholder="Required summary of what changed" required>
                    </div>
                    <div class="mb-0">
                        <label for="markdown_body" class="form-label">Document Body</label>
                        <textarea class="form-control" id="markdown_body" name="markdown_body" rows="30" style="font-family: monospace;">{{ version.markdown_body }}</textarea>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-5">
            <div class="card h-100">
                <div class="card-header"><strong>Preview</strong></div>
                <div class="card-body" id="preview">{{ rendered_html|safe }}</div>
            </div>
        </div>
    </div>
    <div class="mt-3 d-flex gap-2 flex-wrap">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle"></i> Save New Version
        </button>
        <a href="{{ url_for('isms.document_detail', document_id=document.id) }}" class="btn btn-secondary">
            Cancel
        </a>
    </div>
</form>

<script>
const textarea = document.getElementById('markdown_body');
const preview = document.getElementById('preview');

function escapeHtml(value) {
    return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function renderInline(value) {
    let rendered = escapeHtml(value);
    rendered = rendered.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    rendered = rendered.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return rendered;
}

function renderMarkdown(value) {
    const lines = value.replace(/\r\n/g, '\n').split('\n');
    const blocks = [];
    let paragraph = [];
    let inList = false;

    function flushParagraph() {
        if (paragraph.length) {
            blocks.push(`<p>${renderInline(paragraph.join(' '))}</p>`);
            paragraph = [];
        }
    }

    function closeList() {
        if (inList) {
            blocks.push('</ul>');
            inList = false;
        }
    }

    for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
            flushParagraph();
            closeList();
            continue;
        }
        if (line.startsWith('### ')) {
            flushParagraph();
            closeList();
            blocks.push(`<h4>${renderInline(line.slice(4))}</h4>`);
            continue;
        }
        if (line.startsWith('## ')) {
            flushParagraph();
            closeList();
            blocks.push(`<h3>${renderInline(line.slice(3))}</h3>`);
            continue;
        }
        if (line.startsWith('# ')) {
            flushParagraph();
            closeList();
            blocks.push(`<h2>${renderInline(line.slice(2))}</h2>`);
            continue;
        }
        if (line.startsWith('- ')) {
            flushParagraph();
            if (!inList) {
                blocks.push('<ul>');
                inList = true;
            }
            blocks.push(`<li>${renderInline(line.slice(2))}</li>`);
            continue;
        }
        closeList();
        paragraph.push(line);
    }

    flushParagraph();
    closeList();
    return blocks.join('\n');
}

textarea.addEventListener('input', () => {
    preview.innerHTML = renderMarkdown(textarea.value);
});
</script>
{% endblock %}
