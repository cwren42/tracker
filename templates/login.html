{% extends "base.html" %}

{% block title %}Login - Asset Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 100px;">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">
                    <i class="bi bi-boxes text-primary"></i><br>
                    Asset Tracker
                </h2>
                <h5 class="text-center text-muted mb-4">Sign In</h5>
                
                <!-- Azure AD SSO Login -->
                <div class="d-grid mb-3">
                    <a href="{{ url_for('login_microsoft') }}" class="btn btn-primary btn-lg">
                        <i class="bi bi-microsoft"></i> Sign in with Microsoft
                    </a>
                </div>
                

            </div>
        </div>
    </div>
</div>
{% endblock %}
