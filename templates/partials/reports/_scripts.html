<script src="/static/vendor/chartjs/chart.umd.min.js"></script>
<script>
// VS Code may show syntax errors due to Jinja2 template tags - these are false positives
// Category Chart (Pie)
const categoryCtx = document.getElementById('categoryChart');
if (categoryCtx) {
    new Chart(categoryCtx, {
        type: 'pie',
        data: {
            labels: [{% for cat in category_stats %}'{{ cat[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}],
            datasets: [{
                data: [{% for cat in category_stats %}{{ cat[1] }}{% if not loop.last %}, {% endif %}{% endfor %}],
                backgroundColor: [
                    '#0d6efd', '#6610f2', '#6f42c1', '#d63384', '#dc3545',
                    '#fd7e14', '#ffc107', '#198754', '#20c997', '#0dcaf0',
                    '#6c757d', '#adb5bd'
                ]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            onClick: (event, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const category = [{% for cat in category_stats %}'{{ cat[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}][index];
                    window.location.href = `/assets?category=${encodeURIComponent(category)}`;
                }
            },
            plugins: {
                legend: {
                    position: 'right',
                    onClick: (e, legendItem, legend) => {
                        const category = legendItem.text;
                        window.location.href = `/assets?category=${encodeURIComponent(category)}`;
                    }
                },
                tooltip: {
                    callbacks: {
                        afterLabel: function() {
                            return 'Click to view assets';
                        }
                    }
                }
            }
        }
    });
    categoryCtx.style.cursor = 'pointer';
}

// Status Chart (Pie)

    new Chart(statusCtx, {
        type: 'pie',
        data: {
            labels: [{% for stat in status_stats %}'{{ stat[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}],
            datasets: [{
                data: [{% for stat in status_stats %}{{ stat[1] }}{% if not loop.last %}, {% endif %}{% endfor %}],
                backgroundColor: ['#198754', '#0dcaf0', '#ffc107', '#6c757d']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            onClick: (event, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const status = [{% for stat in status_stats %}'{{ stat[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}][index];
                    window.location.href = `/assets?status=${encodeURIComponent(status)}`;
                }
            },
            plugins: {
                legend: {
                    position: 'right',
                    onClick: (e, legendItem, legend) => {
                        const status = legendItem.text;
                        window.location.href = `/assets?status=${encodeURIComponent(status)}`;
                    }
                },
                tooltip: {
                    callbacks: {
                        afterLabel: function() {
                            return 'Click to view assets';
                        }
                    }
                }
            }
        }
    });
    statusCtx.style.cursor = 'pointer';
}

// Value by Category Chart (Bar)
const valueCtx = document.getElementById('valueChart');
if (valueCtx) {
    new Chart(valueCtx, {
        type: 'bar',
        data: {
            labels: [{% for cat in category_stats %}'{{ cat[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}],
            datasets: [{
                label: 'Total Value ($)',
                data: [{% for cat in category_stats %}{{ cat[2] if cat[2] else 0 }}{% if not loop.last %}, {% endif %}{% endfor %}],
                backgroundColor: '#0d6efd'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            onClick: (event, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const category = [{% for cat in category_stats %}'{{ cat[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}][index];
                    window.location.href = `/assets?category=${encodeURIComponent(category)}`;
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) {
                            return '$' + value.toLocaleString();
                        }
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        afterLabel: function() {
                            return 'Click to view assets';
                        }
                    }
                }
            }
        }
    });
    valueCtx.style.cursor = 'pointer';
}

// Department Chart (Horizontal Bar)
const deptCtx = document.getElementById('departmentChart');
if (deptCtx) {
    new Chart(deptCtx, {
        type: 'bar',
        data: {
            labels: [{% for dept in dept_stats %}'{{ dept[0] or "Unassigned" }}'{% if not loop.last %}, {% endif %}{% endfor %}],
            datasets: [{
                label: 'Asset Count',
                data: [{% for dept in dept_stats %}{{ dept[1] }}{% if not loop.last %}, {% endif %}{% endfor %}],
                backgroundColor: '#198754'
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                x: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });
}

// Lifecycle Chart (Doughnut)
const lifecycleCtx = document.getElementById('lifecycleChart');
if (lifecycleCtx) {
    const lifecycleData = {{ lifecycle_stats|tojson }};
    const labels = Object.keys(lifecycleData);
    const data = Object.values(lifecycleData);
    const colors = {
        'New': '#198754',
        'Active': '#0d6efd',
        'Aging': '#0dcaf0',
        'Replace Soon': '#ffc107',
        'End of Life': '#dc3545'
    };
    const bgColors = labels.map(label => colors[label] || '#6c757d');
    
    new Chart(lifecycleCtx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: bgColors
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            onClick: (event, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const lifecycle = labels[index];
                    window.location.href = `/assets?lifecycle=${encodeURIComponent(lifecycle)}`;
                }
            },
            plugins: {
                legend: {
                    position: 'right',
                    onClick: (e, legendItem, legend) => {
                        const lifecycle = legendItem.text;
                        window.location.href = `/assets?lifecycle=${encodeURIComponent(lifecycle)}`;
                    }
                },
                tooltip: {
                    callbacks: {
                        afterLabel: function() {
                            return 'Click to view assets';
                        }
                    }
                }
            }
        }
    });
    lifecycleCtx.style.cursor = 'pointer';
}

// License Vendor Chart
const licenseVendorCtx = document.getElementById('licenseVendorChart');
if (licenseVendorCtx) {
    new Chart(licenseVendorCtx, {
        type: 'pie',

            labels: [{% for vendor in license_vendor_stats %}'{{ vendor[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}],

                backgroundColor: ['#0dcaf0', '#198754', '#fd7e14', '#6c757d', '#0d6efd', '#d63384', '#20c997', '#ffc107']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'right'
                }
            }
        }
    });
}

// License Type Chart

if (licenseTypeCtx) {

        type: 'doughnut',
        data: {
            labels: [{% for type in license_type_stats %}'{{ type[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}],
            datasets: [{
                data: [{% for type in license_type_stats %}{{ type[1] }}{% if not loop.last %}, {% endif %}{% endfor %}],
                backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6c757d']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {

// License Cost Chart
const licenseCostCtx = document.getElementById('licenseCostChart');
if (licenseCostCtx) {
    new Chart(licenseCostCtx, {
        type: 'bar',
        data: {
            labels: [{% for vendor in license_vendor_stats %}'{{ vendor[0] }}'{% if not loop.last %}, {% endif %}{% endfor %}],
            datasets: [{
                label: 'Annual Cost ($)',
                data: [{% for vendor in license_vendor_stats %}{{ vendor[2] if vendor[2] else 0 }}{% if not loop.last %}, {% endif %}{% endfor %}],
                backgroundColor: '#198754'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) {
                            return '$' + value.toLocaleString();
                        }
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return '$' + context.parsed.y.toLocaleString();
                        }
                    }
                }
            }
        }
    });
}

// License Utilization Chart
const licenseUtilizationCtx = document.getElementById('licenseUtilizationChart');
if (licenseUtilizationCtx) {
    const utilizationData = [
        {% for lic in license_utilization %}
        {
            software: '{{ lic.software }}',
            assigned: {{ lic.assigned }},
            available: {{ lic.available }}
        }{% if not loop.last %},{% endif %}
        {% endfor %}
    ];
    
    new Chart(licenseUtilizationCtx, {
        type: 'bar',
        data: {
            labels: utilizationData.map(d => d.software),
            datasets: [{
                label: 'Assigned',
                data: utilizationData.map(d => d.assigned),
                backgroundColor: '#0d6efd'
            }, {
                label: 'Available',
                data: utilizationData.map(d => d.available),
                backgroundColor: '#198754'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    stacked: true
                },
                y: {
                    stacked: true,
                    beginAtZero: true
                }
            },
            plugins: {
                legend: {
                    position: 'top'
                }
            }
        }
    });
}

// Add to Dashboard functionality
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.add-to-dashboard-btn').forEach(button => {
        button.addEventListener('click', function() {
            const widgetId = this.dataset.widgetId;
            const widgetType = this.dataset.widgetType;
            const widgetTitle = this.dataset.widgetTitle;
            
            // Disable button and show loading
            const originalHtml = this.innerHTML;
            this.disabled = true;
            this.innerHTML = '<i class="bi bi-hourglass-split"></i> Adding...';
            
            // Send request to add widget
            // Determine appropriate size based on widget type
            let widgetSize = 'col-md-6 widget-1-row'; // Default
            if (widgetId === 'overview_stats' || widgetType === 'list' || widgetType === 'table') {
                widgetSize = 'col-md-12 widget-1-row'; // Full width for overview, lists, and tables
            }
            
            fetch('{{ url_for("dashboard.add_widget_to_dashboard") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    widget_id: widgetId,
                    widget_type: widgetType,
                    title: widgetTitle,
                    size: widgetSize
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Show success
                    this.innerHTML = '<i class="bi bi-check-circle"></i> Added!';
                    this.classList.remove('btn-primary', 'btn-light');
                    this.classList.add('btn-success');
                    
                    // Show toast notification
                    if (typeof bootstrap !== 'undefined') {
                        alert(data.message + '\n\nGo to the dashboard to see your new widget!');
                    }
                    
                    // Reset button after 3 seconds
                    setTimeout(() => {
                        this.disabled = false;
                        this.innerHTML = originalHtml;
                        this.classList.remove('btn-success');
                        this.classList.add('btn-primary');
                    }, 3000);
                } else {
                    // Show error - check if it's already exists
                    if (data.message && data.message.includes('already exists')) {
                        this.innerHTML = '<i class="bi bi-check-circle"></i> On Dashboard';
                        this.classList.remove('btn-primary', 'btn-light');
                        this.classList.add('btn-secondary');
                        this.disabled = true;
                    } else {
                        this.innerHTML = '<i class="bi bi-x-circle"></i> Error';
                        this.classList.remove('btn-primary', 'btn-light');
                        this.classList.add('btn-danger');
                        alert('Error: ' + data.message);
                        
                        // Reset button
                        setTimeout(() => {
                            this.disabled = false;
                            this.innerHTML = originalHtml;
                            this.classList.remove('btn-danger');
                            this.classList.add('btn-primary');
                        }, 3000);
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                this.innerHTML = '<i class="bi bi-x-circle"></i> Error';
                this.classList.remove('btn-primary', 'btn-light');
                this.classList.add('btn-danger');
                alert('Failed to add widget to dashboard');
                
                // Reset button
                setTimeout(() => {
                    this.disabled = false;
                    this.innerHTML = originalHtml;
                    this.classList.remove('btn-danger');
                    this.classList.add('btn-primary');
                }, 3000);
            });
        });
    });
    
    // Load custom reports
    loadCustomReports();
});

function loadCustomReports() {
    fetch('{{ url_for("reports.list_custom_reports") }}')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.reports.length > 0) {
                document.getElementById('customReportsSection').style.display = 'block';
                const container = document.getElementById('customReportsContainer');
                container.innerHTML = '<div class="row g-3">' + data.reports.map(report => {
                    const icon = report.report_type === 'stat' ? 'bi-calculator' : 
                                report.report_type === 'chart' ? 'bi-bar-chart' : 'bi-list-ul';
                    const color = report.report_type === 'stat' ? 'primary' : 
                                 report.report_type === 'chart' ? 'success' : 'info';
                    
                    return `
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-${color} text-white d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0"><i class="bi ${icon}"></i> ${report.name}</h5>
                                    <div>
                                        ${report.is_own ? `
                                            <button class="btn btn-sm btn-danger" onclick="deleteCustomReport(${report.id})">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        ` : ''}
                                        <button class="btn btn-sm btn-light add-to-dashboard-btn" 
                                                data-widget-id="custom_report_${report.id}" 
                                                data-widget-type="${report.report_type}" 
                                                data-widget-title="${report.name}"
                                                title="Add to Dashboard">
                                            <i class="bi bi-plus-circle"></i> Dashboard
                                        </button>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <p class="mb-0 text-muted small">${report.description || 'Custom ' + report.report_type + ' report'}</p>
                                    <small class="text-muted">Created: ${report.created_at}</small>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('') + '</div>';
                
                // Re-attach event listeners to new buttons
                attachDashboardButtonListeners();
            }
        })
        .catch(error => console.error('Error loading custom reports:', error));
}

function deleteCustomReport(reportId) {
    if (!confirm('Are you sure you want to delete this custom report?')) {
        return;
    }
    
    fetch(`{{ url_for('reports.delete_custom_report', report_id=0) }}`.replace('/0', '/' + reportId), {
        method: 'DELETE'
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert(data.message);
            loadCustomReports();
        } else {
            alert('Error: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Failed to delete report');
    });
}

function attachDashboardButtonListeners() {
    document.querySelectorAll('.add-to-dashboard-btn').forEach(button => {
        // Remove old listener if exists
        button.replaceWith(button.cloneNode(true));
    });
    
    document.querySelectorAll('.add-to-dashboard-btn').forEach(button => {
        button.addEventListener('click', function() {
            const widgetId = this.dataset.widgetId;
            const widgetType = this.dataset.widgetType;
            const widgetTitle = this.dataset.widgetTitle;
            
            // Disable button and show loading
            const originalHtml = this.innerHTML;
            this.disabled = true;
            this.innerHTML = '<i class="bi bi-hourglass-split"></i> Adding...';
            
            // Send request to add widget
            let widgetSize = 'col-md-6 widget-1-row';
            if (widgetType === 'stat') {
                widgetSize = 'col-md-2 widget-1-row';
            } else if (widgetType === 'list' || widgetType === 'table') {
                widgetSize = 'col-md-12 widget-1-row';
            }
            
            fetch('{{ url_for("dashboard.add_widget_to_dashboard") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    widget_id: widgetId,
                    widget_type: widgetType,
                    title: widgetTitle,
                    size: widgetSize
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    this.innerHTML = '<i class="bi bi-check-circle"></i> Added!';
                    this.classList.remove('btn-primary', 'btn-light');
                    this.classList.add('btn-success');
                    alert(data.message + '\n\nGo to the dashboard to see your new widget!');
                    
                    setTimeout(() => {
                        this.disabled = false;
                        this.innerHTML = originalHtml;
                        this.classList.remove('btn-success');
                        this.classList.add('btn-primary', 'btn-light');
                    }, 3000);
                } else {
                    if (data.message && data.message.includes('already exists')) {
                        this.innerHTML = '<i class="bi bi-check-circle"></i> On Dashboard';
                        this.classList.remove('btn-primary', 'btn-light');
                        this.classList.add('btn-secondary');
                        this.disabled = true;
                    } else {
                        this.innerHTML = '<i class="bi bi-x-circle"></i> Error';
                        this.classList.remove('btn-primary', 'btn-light');
                        this.classList.add('btn-danger');
                        alert('Error: ' + data.message);
                        
                        setTimeout(() => {
                            this.disabled = false;
                            this.innerHTML = originalHtml;
                            this.classList.remove('btn-danger');
                            this.classList.add('btn-primary', 'btn-light');
                        }, 3000);
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                this.innerHTML = '<i class="bi bi-x-circle"></i> Error';
                alert('Failed to add widget to dashboard');
                
                setTimeout(() => {
                    this.disabled = false;
                    this.innerHTML = originalHtml;
                }, 3000);
            });
        });
    });
}
</script>
