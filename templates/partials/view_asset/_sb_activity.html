<!-- ══ ACTIVITY (sidebar section) — agent availability + session events ══ -->
{% if rmm_agent_id and rmm_visible %}
<div id="sb-activity-section">
  <div class="card section-card">
    <div class="card-header"><i class="bi bi-clock-history me-2 text-info"></i>Activity</div>
    <div class="card-body p-3" style="font-size:.85rem;">
      <!-- Agent online/offline -->
      <div class="mb-2">
        <strong style="font-size:.82rem;"><i class="bi bi-wifi me-1"></i>Agent Availability</strong>
        <div id="rmm-avail-content" style="max-height:130px;overflow-y:auto;margin-top:.35rem;">
          <span class="text-muted">Loading…</span>
        </div>
      </div>
      <hr class="my-2">
      <!-- Session events -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong style="font-size:.82rem;"><i class="bi bi-person-lines-fill me-1"></i>Session Activity</strong>
        <select class="form-select form-select-sm" style="width:auto;font-size:.75rem;" id="rmm-sev-days" onchange="rmmLoadSessionEvents(true)">
          <option value="1">Last 24 h</option>
          <option value="7" selected>Last 7 days</option>
          <option value="30">Last 30 days</option>
        </select>
      </div>
      <div id="rmm-sev-content" style="max-height:220px;overflow-y:auto;">
        <span class="text-muted">Loading…</span>
      </div>
    </div>
  </div>
</div>
{% endif %}
