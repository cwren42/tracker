<!-- ══ PATCHES TAB ════════════════════════════════════════════ -->
{% if rmm_agent_id and rmm_visible %}
<div class="tab-pane fade" id="tab-patches" role="tabpanel">
    <div class="card section-card">
        <div class="card-body p-3" style="font-size:.85rem;">
            <!-- Pending Updates -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <strong style="font-size:.82rem;"><i class="bi bi-cloud-download me-1"></i>Pending Updates</strong>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary py-0" onclick="rmmScanPatches()" id="rmm-scan-btn" title="Re-scan for pending updates">
                        <i class="bi bi-arrow-clockwise me-1"></i>Scan
                    </button>
                    <button class="btn btn-sm btn-primary py-0" onclick="rmmApprovePatches()" id="rmm-approve-btn" disabled>
                        <i class="bi bi-check2 me-1"></i>Approve Selected
                    </button>
                </div>
            </div>
            <div id="rmm-pending-content" style="max-height:200px;overflow-y:auto;font-size:.8rem;">
                <span class="text-muted">Loading…</span>
            </div>
            <!-- Deployment Jobs -->
            <hr class="my-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <strong style="font-size:.82rem;"><i class="bi bi-list-check me-1"></i>Deployment Jobs</strong>
                <small class="text-muted" id="rmm-jobs-updated"></small>
            </div>
            <div id="rmm-jobs-content" style="max-height:180px;overflow-y:auto;font-size:.8rem;">
                <span class="text-muted">Loading…</span>
            </div>
            <!-- Installed hotfixes -->
            <hr class="my-2">
            <a class="text-muted" data-bs-toggle="collapse" href="#rmm-installed-collapse" style="font-size:.8rem;">
                <i class="bi bi-chevron-down me-1"></i>View installed hotfixes
            </a>
            <div class="collapse show" id="rmm-installed-collapse">
                <div id="rmm-patches-content" style="max-height:200px;overflow-y:auto;font-size:.8rem;margin-top:.5rem;">
                    <span class="text-muted">Loading…</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
