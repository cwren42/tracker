<!-- ══ RUN SCRIPT TAB ═════════════════════════════════════════ -->
{% if rmm_agent_id %}
<div class="tab-pane fade" id="tab-scripts" role="tabpanel">
    <div class="card section-card">
        <div class="card-body p-3" style="font-size:.85rem;">
            <!-- Saved scripts -->
            <div class="border rounded p-2 mb-2" style="background:rgba(25,135,84,.06);border-color:rgba(25,135,84,.25)!important;">
                <div class="d-flex flex-wrap gap-2 align-items-end">
                    <div style="min-width:300px;flex:1 1 300px;">
                        <label class="form-label small mb-1">Saved Tested Scripts</label>
                        <select class="form-select form-select-sm" id="rmm-saved-script-select">
                            <option value="">Loading tested scripts…</option>
                        </select>
                    </div>
                    <button class="btn btn-sm btn-success" id="rmm-saved-script-run-btn" onclick="rmmRunSavedScript()">
                        <i class="bi bi-play-fill"></i> Run Selected Script
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="rmmLoadSavedScripts()">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
                <div id="rmm-saved-script-meta" class="small text-muted mt-1"></div>
            </div>
            <!-- Shell / timeout controls -->
            <div class="d-flex flex-wrap gap-2 mb-2 align-items-end">
                <select class="form-select form-select-sm" id="rmm-script-shell" style="width:130px;">
                    <option value="powershell">PowerShell</option>
                    <option value="cmd">CMD</option>
                    <option value="bash">Bash</option>
                </select>
                <select class="form-select form-select-sm" id="rmm-script-timeout" style="width:120px;">
                    <option value="30">30s timeout</option>
                    <option value="60" selected>60s timeout</option>
                    <option value="120">2min timeout</option>
                    <option value="300">5min timeout</option>
                </select>
                <button class="btn btn-sm btn-outline-secondary ms-auto" onclick="document.getElementById('rmm-script-output').textContent='';document.getElementById('rmm-script-status').textContent=''">Clear</button>
                <button class="btn btn-sm btn-primary" id="rmm-script-run-btn" onclick="rmmRunScript()">
                    <i class="bi bi-play-fill"></i> Run
                </button>
            </div>
            <textarea class="form-control font-monospace mb-2" id="rmm-script-code" rows="7"
                      placeholder="Enter PowerShell or CMD code…" style="font-size:.78rem;resize:vertical;"></textarea>
            <pre id="rmm-script-output" class="bg-dark text-light rounded p-2 mb-1"
                 style="min-height:60px;max-height:280px;overflow-y:auto;white-space:pre-wrap;font-size:.75rem;margin:0;"></pre>
            <div id="rmm-script-status" class="small text-muted mt-1"></div>
        </div>
    </div>
</div>
{% endif %}
