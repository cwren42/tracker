{% extends "base.html" %}

{% block title %}QR Code - {{ asset.asset_tag }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3 text-center">
        <h2 class="mb-4">QR Code for {{ asset.asset_tag }}</h2>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ asset.name }}</h5>
                <p class="text-muted">{{ asset.category }}</p>
                <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" class="img-fluid mb-3">
                <p class="small text-muted">Scan this code to view asset details</p>
                <button onclick="window.print()" class="btn btn-primary">
                    <i class="bi bi-printer"></i> Print
                </button>
                <a href="{{ url_for('view_asset', asset_id=asset.id) }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    @media print {
        .navbar, .btn, .footer { display: none; }
    }
</style>
{% endblock %}
