{% extends "base.html" %}

{% block title %}Theme Settings - Admin{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-4">
        <div class="col d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="bi bi-palette me-2"></i>Appearance Settings</h2>
                <p class="text-muted">Customize the look and feel of the application</p>
            </div>
            <a href="{{ url_for('settings.settings') }}" class="btn btn-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Settings
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-palette me-2"></i>Theme & Appearance</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="action" value="update_theme">
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Theme Preference</label>
                                <select class="form-select" name="theme">
                                    <option value="dark" selected>Dark (Default)</option>
                                    <option value="light">Light</option>
                                    <option value="auto">System</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-secondary">
                                <i class="bi bi-save me-1"></i>Save Settings
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
